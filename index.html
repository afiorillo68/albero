<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="strict-origin">
<meta name="theme-color" content="#1f3a4d">
<meta name="color-scheme" content="light">
<title>Albero di famiglia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B3%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="stile.css">
</head>
<body>
<div id="avvio"><div class="avvio-scheda"><div class="girandola"></div><h1>Apro l'albero…</h1></div></div>

<header id="barra">
  <div class="marchio"><span class="logo">🌳</span><span id="titolo">Albero di famiglia</span><span id="rete" hidden></span></div>
  <div class="ricerca">
    <svg class="icona lente" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="cerca" type="search" placeholder="Cerca una persona…" autocomplete="off" aria-label="Cerca una persona">
    <button id="b-avanzata" type="button" title="Ricerca avanzata" aria-label="Ricerca avanzata"><svg class="icona" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
    <ul id="risultati" hidden></ul>
  </div>
  <nav class="comandi">
    <button id="b-filtri" type="button" title="Filtri"><svg class="icona" viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg><span>Filtri</span></button>
    <button id="b-disposizione" type="button" class="solo-modifica" title="Sistema il disegno"><svg class="icona" viewBox="0 0 24 24"><path d="M5 9 2 12l3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/></svg><span>Disposizione</span></button>
    <button id="b-aggiungi" type="button" class="solo-modifica" title="Aggiungi una persona"><svg class="icona" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Persona</span></button>
    <button id="b-storico" type="button" class="solo-modifica" title="Storico delle modifiche"><svg class="icona" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg><span>Storico</span></button>
    <button id="b-esporta" type="button" title="Esporta"><svg class="icona" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span>Esporta</span></button>
    <button id="b-menu" type="button" title="Menu"><svg class="icona" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
  </nav>
</header>

<div id="nastro"></div>

<main id="area">
  <svg id="tela" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Albero di famiglia"></svg>
</main>

<div id="attrezzi" hidden>
  <button type="button" data-attrezzo="griglia" title="Aggancia alla griglia">Griglia</button>
  <button type="button" data-attrezzo="guide" title="Guide di allineamento">Guide</button>
  <span class="separatore"></span>
  <button type="button" data-attrezzo="annulla" title="Annulla (Cmd+Z)">Annulla</button>
  <button type="button" data-attrezzo="ripeti" title="Ripeti (Maiusc+Cmd+Z)">Ripeti</button>
  <span class="separatore"></span>
  <span id="suggerimento-linea" class="suggerimento" hidden>Trascina i punti; doppio clic su un punto per toglierlo</span>
  <button type="button" data-attrezzo="ripristina-linea" title="Riporta la linea selezionata com'era quando hai aperto Disposizione">Ripristina linea</button>
  <button type="button" data-attrezzo="raddrizza" title="Riporta la linea selezionata al percorso automatico">Raddrizza</button>
  <button type="button" data-attrezzo="riallinea" title="Riporta il nodo dell'unione fra i partner">Riallinea</button>
  <button type="button" data-attrezzo="ridisponi" title="Disposizione automatica">Ridisponi…</button>
  <span class="separatore"></span>
  <button type="button" data-attrezzo="fine" class="primario">Fine</button>
</div>

<div id="zoom">
  <button id="z-piu" type="button" title="Avvicina">+</button>
  <button id="z-meno" type="button" title="Allontana">−</button>
  <button id="z-adatta" type="button" title="Inquadra tutto"><svg class="icona" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<aside id="pannello" hidden>
  <div class="maniglia-foglio"></div>
  <header><h2 id="pannello-titolo"></h2><button id="pannello-chiudi" type="button" title="Chiudi">✕</button></header>
  <div id="pannello-corpo"></div>
</aside>

<div id="avvisi" aria-live="polite"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
